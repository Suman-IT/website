<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reception desk</title><link rel="stylesheet" href="/staff.css"></head>
<body>
  <header class="topbar"><a class="brand" href="/"><span class="mark">+</span><span id="hospital-name">Reception desk</span></a><span class="desk-label">STAFF WORKSPACE</span></header>
  <main class="shell">
    <section id="login-view" class="login-panel"><p class="eyebrow">Secure staff access</p><h1>Good morning.<br>Ready when you are.</h1><form id="login-form"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><p id="login-message" class="message" role="alert"></p><button class="button dark" type="submit">Sign in <span aria-hidden="true">&#8594;</span></button></form></section>
    <section id="desk-view" hidden>
      <div class="desk-heading"><div><p class="eyebrow">Reception desk</p><h1 id="greeting">Appointments</h1></div><button id="logout" class="button light">Sign out</button></div>
      <div class="toolbar"><label>Date<input id="queue-date" type="date"></label><label>Doctor<select id="queue-doctor"><option value="">All doctors</option></select></label><label>Status<select id="queue-status"><option value="">All statuses</option><option>BOOKED</option><option>CONFIRMED</option><option>CHECKED_IN</option><option>WAITING</option><option>IN_CONSULTATION</option><option>COMPLETED</option><option>NO_SHOW</option><option>CANCELLED</option></select></label><label class="search-label">Search<input id="queue-search" placeholder="Name, mobile or ID"></label><button id="refresh" class="icon-button" title="Refresh queue" aria-label="Refresh queue">&#8635;</button></div>
      <div id="desk-message" class="desk-message" role="status"></div>
      <div class="content-grid"><section class="queue-panel"><div class="panel-heading"><div><p class="eyebrow">Live queue</p><h2 id="queue-title">Today</h2></div><strong id="queue-count">0</strong></div><div id="queue-list" class="queue-list"><p class="empty">No appointments for this view.</p></div></section><aside class="side-column"><section class="action-panel"><div class="panel-heading"><div><p class="eyebrow">New booking</p><h2>Reserve a place</h2></div></div><form id="booking-form"><div class="segmented"><label><input type="radio" name="source" value="PHONE" checked>Phone</label><label><input type="radio" name="source" value="WALK_IN">Walk-in</label></div><label>Doctor<select name="doctor" id="booking-doctor" required><option value="">Select doctor</option></select></label><div class="two-col"><label>Date<input name="date" id="booking-date" type="date" required></label><label>Sitting<select name="session" id="booking-session" required disabled><option>Choose date</option></select></label></div><label>Patient name<input name="fullName" maxlength="150" required></label><label>Mobile<input name="mobile" type="tel" placeholder="+91 98765 43210" required></label><p id="booking-message" class="message" role="alert"></p><button class="button coral" type="submit">Save booking <span aria-hidden="true">&#8594;</span></button></form></section><section class="action-panel search-panel"><div class="panel-heading"><div><p class="eyebrow">Patient lookup</p><h2>Find a patient</h2></div></div><form id="patient-search"><label>Mobile or name<input name="query" placeholder="Search existing records" required></label><button class="button light" type="submit">Search</button></form><div id="patient-results" class="patient-results"></div></section></aside></div>
    </section>
  </main>
  <template id="queue-row"><article class="queue-row"><div class="queue-main"><span class="serial"></span><div><strong class="patient"></strong><span class="meta"></span></div></div><div class="queue-time"></div><div class="queue-status"></div><div class="queue-actions"></div></article></template>
  <script src="/staff.js" defer></script>
</body>
</html>
